name: KB V2.1 offline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public source and history
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check_public_source.py --history
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: projects/kb-ingestion-workflow/integrations/kb_custody_v21/f05_cli_guard/go.sum
      - name: Fetch pinned official CLI dependencies
        working-directory: projects/kb-ingestion-workflow/integrations/kb_custody_v21/f05_cli_guard
        env:
          GOMAXPROCS: '1'
          GOMEMLIMIT: 256MiB
          GOTOOLCHAIN: local
        run: go mod download
      - name: Create isolated linked worktree
        run: git worktree add -b codex/kb-ingestion-v2.1 "$RUNNER_TEMP/kb-v21-dev" HEAD
      - name: Install pinned offline runtime dependencies
        run: python -m pip install -r projects/kb-ingestion-workflow/integrations/kb_custody_v21/requirements.lock
      - name: Install local PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Run synthetic tests with network guards
        working-directory: ${{ runner.temp }}/kb-v21-dev
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          KB_V21_PREVIEW_FONT: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
        run: python projects/kb-ingestion-workflow/integrations/kb_custody_v21/run_review_tests.py
